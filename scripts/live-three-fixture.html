<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:#020510}#world{width:100vw;height:100vh}</style></head>
<body><div id="world"></div><script type="module">
import { ThreeRaidPresentation } from '/src/components/games/raid/threePresentation.ts'
import { DEFAULT_RAID_PALETTE } from '/src/components/games/raid/background.ts'
const scene = new ThreeRaidPresentation(message => { if(message) document.body.dataset.error=message })
const ready = await scene.init(document.getElementById('world'))
const empty = { shots:[],guestShots:[],enemyShots:[],enemies:[],sparks:[],ripples:[] }
window.threeFixture = {
  ready, scene,
  async draw(key,bank=0,landscape=false,stageTheme=1) {
    await scene.prepareHull(key)
    const width=innerWidth,height=innerHeight,time=10000
    scene.render({ width,height,dpr:1,time,palette:DEFAULT_RAID_PALETTE,quality:'high',
      stageTheme,landscape,stageNumber:1,stageAge:0,stageRush:0,bossIntensity:0,devilCorruption:0 })
    scene.renderForeground({ width,height,dpr:1,time,visualScale:1,landscape,guestView:false,
      measureGpu:true,bounds:{left:-10,right:110,top:-10,bottom:110,marginX:10,marginY:10},
      drawAdvancedShotFx:true,drawRipples:true,maxSparks:200,maxRipples:100,...empty })
    const drawn=scene.submitHull({ id:'subject',key,x:width*.5,y:height*.52,
      size:Math.min(width,height)*.66,bank,angle:0,alpha:1,landscape })
    scene.present()
    return {drawn,...scene.getRaidGpuStats()}
  }
}
document.body.dataset.ready=String(ready)
</script></body></html>
