name: Review planetary terrain
on:
  push:
    branches: [main, fix-planet-terrain-3d]
    paths:
      - 'src/components/games/raid/planetFlight*.ts'
      - 'src/components/games/raid/planetTerrainGeometry.ts'
      - 'src/components/games/raid/landscapeAtmosphere.ts'
      - 'scripts/check-planet-terrain.mjs'
      - '.github/workflows/verify-planet-terrain.yml'
permissions:
  contents: read
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check atmosphere geometry and lifecycle
        run: node scripts/test-planet-atmosphere.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check terrain movement and gameplay captures
        run: node scripts/review-raid-campaign-browser.mjs --captures-only
        env:
          RAID_REVIEW_TERRAIN_CHECK: '1'
          RAID_REVIEW_STAGES: '5,10'
          RAID_REVIEW_OUTPUT: presentation-review/terrain-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planet-terrain-review
          path: presentation-review/terrain-v1/
