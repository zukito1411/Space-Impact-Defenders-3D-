name: Render solid flight poses
on:
  push:
    branches: [art/solid-bank-build]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render 21 poses per flight view
        run: |
          if python -m pip install --only-binary=:all: bpy==4.3.0 'numpy<2' Pillow && python scripts/bake-flight-hulls.py; then
            exit 0
          fi
          sudo apt-get -qq update
          sudo apt-get -qq install -y blender python3-pil python3-numpy
          blender -b -t 4 --python-exit-code 1 -P scripts/bake-flight-hulls.py
      - name: Publish pose assets
        run: |
          test "$(ls public/assets/ships/banking/*-v15.webp | wc -l)" = 24
          git reset --mixed b9a5f67127f0a7f0a38d6fbbf9204db70c072c55
          git add scripts/bake-flight-hulls.py src/components/games/raid/bankingAnchors.json public/assets/ships/banking/*-v15.webp
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Render solid physical banking poses for the fleet'
          git push origin HEAD:refs/heads/art/solid-bank-renders
