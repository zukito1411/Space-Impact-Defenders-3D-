name: Review cloud motion and X-wing alignment
on:
  push:
    branches: [main, fix-cloud-wind-crosswing]
    paths:
      - 'src/components/games/raid/planetCloudMotion.ts'
      - 'src/components/games/raid/landscapeAtmosphere.ts'
      - 'public/assets/ships/models/v1/xwing*.glb'
      - 'scripts/check-clouds-crosswing.mjs'
      - '.github/workflows/review-clouds-crosswing.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check wind transport and shipped geometry
        run: |
          node scripts/test-planet-atmosphere.mjs
          python3 scripts/test-crosswing-alignment.py
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Review gameplay in both orientations
        run: node scripts/review-raid-campaign-browser.mjs --captures-only
        env:
          RAID_REVIEW_CLOUD_WING_CHECK: '1'
          RAID_REVIEW_STAGES: '5,10'
          RAID_REVIEW_OUTPUT: presentation-review/clouds-crosswing-v1
      - run: python3 -m pip install Pillow
      - name: Package lossless cloud motion previews
        run: python3 scripts/pack-cloud-motion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clouds-crosswing-review
          path: presentation-review/clouds-crosswing-v1/
