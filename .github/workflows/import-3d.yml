name: Import preserved Space Impact Defenders 3D
on:
  push:
    paths:
      - .github/workflows/import-3d.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import original 3D game files and bundled assets
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/space-defenders-3d-source"
          git clone --depth 1 --single-branch --branch Space-Impact-Defenders-3D \
            https://github.com/zukito1411/space-defenders-impact.git "$source_dir"
          expected=0bae34ef0f786458b01731789be4ea50a34e3c52
          actual="$(git -C "$source_dir" rev-parse HEAD)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Preserved 3D branch changed; refusing to import."
            exit 1
          fi
          # GitHub Actions' automatic token cannot write workflow files,
          # so preserve the importing workflow and copy the game separately.
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' \
            "$source_dir/" ./
          test -f src/components/games/raid/bankingArt.ts
          test -f public/assets/ships/banking/rocket-v1.webp
          test -f package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "::error::Cannot modify workflow files using this token."
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Import Space Impact Defenders 3D game sources and assets from 0bae34e"
            git push origin HEAD:main
          fi
          echo "Imported 3D game files; CI workflow files are restored separately."
