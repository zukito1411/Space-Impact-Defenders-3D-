name: Review enemy and boss banking
on:
  push:
    branches: [main]
    paths:
      - 'src/components/games/raid/enemyBanking.ts'
      - 'src/components/games/raid/enemyRender.ts'
      - 'src/components/games/raid/genericBossRender.ts'
      - 'src/components/games/raid/threeShipPresentation.ts'
      - 'src/components/games/raid/liveHullBridge.ts'
      - 'scripts/check-enemy-banking.mjs'
      - 'scripts/test-enemy-banking.mjs'
      - 'scripts/review-raid-campaign-browser.mjs'
      - '.github/workflows/review-enemy-banking.yml'
permissions:
  contents: read
jobs:
  banking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check bank response and preserved special attack rigs
        run: |
          node scripts/test-enemy-banking.mjs
          node scripts/test-special-boss-geometry.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Capture all bosses and check both orientations
        run: node scripts/review-raid-campaign-browser.mjs --captures-only
        env:
          RAID_REVIEW_ENEMY_BANK_CHECK: '1'
          RAID_REVIEW_OUTPUT: presentation-review/enemy-banking-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enemy-boss-banking-review
          path: presentation-review/enemy-banking-v1/
