name: Render source Blender ship models (review only)
on:
  workflow_dispatch:
    inputs:
      ship:
        description: "Which authored Blender ship should be rendered?"
        required: true
        type: choice
        options:
          - xwing
          - spaceEt

permissions:
  contents: read

jobs:
  render-source-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check exact uploaded source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest=json.loads(Path('art/3d/render-manifest.json').read_text())
          ship='${{ inputs.ship }}'
          entry=manifest[ship]
          model=Path('art/3d/models')/entry['model']
          reference=Path(entry['reference'])
          if not model.is_file():
              raise SystemExit(f"Missing {model}: upload the original .blend from the source archive before running this workflow.")
          if not reference.is_file():
              raise SystemExit(f"Missing matching 2D paint reference {reference}")
          digest=hashlib.sha256(model.read_bytes()).hexdigest()
          if digest!=entry['sha256']:
              raise SystemExit('Source model SHA256 differs from recovered original, refusing to silently substitute geometry.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
              o.write(f'model={model}\nreference={reference}\n')
          print(f"Verified {ship} original model and exact 2D reference.")
          PY
      - name: Install official Blender 4.3.2 for original Blender 4.3 files
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/blender.tar.xz" \
            https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version | head -2
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
      - name: Render original PBR mesh from 7 physical angles and 2 camera modes
        shell: bash
        run: |
          set -euo pipefail
          blender -b -t 4 --python scripts/render_source_model_banking.py -- \
            --model "${{ steps.source.outputs.model }}" \
            --reference "${{ steps.source.outputs.reference }}" \
            --manifest art/3d/render-manifest.json \
            --ship "${{ inputs.ship }}" \
            --out "model-preview/${{ inputs.ship }}" \
            --pixels 1024 --samples 64
      - name: Pack gameplay-sized, antialiased model atlas
        run: |
          python3 -m pip install "Pillow==11.3.0"
          python3 scripts/pack_source_model_banking.py \
            --frames "model-preview/${{ inputs.ship }}" \
            --out "model-preview/${{ inputs.ship }}-source-v6.webp" --cell 448
      - name: Publish review-only source renders, never overwrite released sprites
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Source-Model-Preview-${{ inputs.ship }}
          path: model-preview/
          if-no-files-found: error
          retention-days: 30
