name: Refresh locked Pixi 3D dependencies

on:
  push:
    branches: [feature/true-3d-space-world]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-3d-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock exact compatible 3D dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm pkg get dependencies.pixi.js dependencies.@pixi/3d
          git diff --check
      - name: Commit lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(3d): lock compatible PixiJS and 3D extension versions"
            git push origin HEAD:feature/true-3d-space-world
          fi
