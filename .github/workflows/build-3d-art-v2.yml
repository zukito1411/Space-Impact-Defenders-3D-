name: Bake high-detail 3D banking textures (one-time)
on:
  workflow_dispatch:
  push:
    branches:
      - fix/3d-hull-color-grade-20261117
    paths:
      - scripts/enhance-3d-banking.py
      - .github/workflows/build-3d-art-v2.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out 3D visual enhancement branch
        uses: actions/checkout@v4
        with:
          ref: fix/3d-hull-color-grade-20261117
          persist-credentials: true
      - name: Install deterministic offline artwork processor
        run: python3 -m pip install "Pillow==11.3.0"
      - name: Bake and verify all 27 2x banking atlases
        run: |
          python3 scripts/enhance-3d-banking.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = sorted(Path("public/assets/ships/banking").glob("*-v1.webp"))
          assert len(source) == 27, f"expected 27 ship atlases; found {len(source)}"
          for path in source:
              new = path.with_name(path.name.replace("-v1.webp", "-v2.webp"))
              assert new.is_file(), new
              with Image.open(new) as im:
                  assert im.size == (3136, 896), (new, im.size)
                  assert im.mode == "RGBA", (new, im.mode)
                  assert im.getchannel("A").getextrema()[1] > 0, new
          print("All 27 enhanced atlas frames verified.")
          PY
      - name: Commit versioned artwork only to the 3D enhancement branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/assets/ships/banking/*-v2.webp
          if ! git diff --cached --quiet; then
            git commit -m "art(3d): add 27 vivid high-DPI banking atlases"
            git push origin HEAD:fix/3d-hull-color-grade-20261117
          fi
