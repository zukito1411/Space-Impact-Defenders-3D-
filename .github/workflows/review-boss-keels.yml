name: Review normal boss lower hulls
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/games/raid/commandBossRender.ts'
      - 'scripts/test-special-boss-geometry.mjs'
      - 'scripts/review-raid-campaign-browser.mjs'
      - '.github/workflows/review-boss-keels.yml'
  push:
    branches: [main, improve-boss-lower-hulls]
    paths:
      - 'src/components/games/raid/commandBossRender.ts'
      - 'scripts/test-special-boss-geometry.mjs'
      - 'src/components/games/raid/bossKeelDesigns.ts'
      - 'src/components/games/raid/bossVentralDetail.ts'
      - 'src/components/games/raid/bossHullDesigns.ts'
      - 'src/components/games/raid/bossHullMaterials.ts'
      - 'src/components/games/raid/volumeGeometry.worker.ts'
      - 'src/components/games/raid/paintedVolume.ts'
      - 'src/components/games/raid/liveHullAssets.ts'
      - 'src/components/games/raid/enemyHulls.ts'
      - 'src/components/games/raid/mobHullDesigns.ts'
      - 'src/components/games/raid/mobHullDetail.ts'
      - 'scripts/test-enemy-volume.mjs'
      - 'scripts/*boss-keels.mjs'
      - 'scripts/review-raid-campaign-browser.mjs'
      - '.github/workflows/review-boss-keels.yml'
permissions:
  contents: read
jobs:
  boss-keels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check preserved upper hulls and special bosses
        run: |
          node scripts/test-enemy-volume.mjs
          node scripts/test-boss-keels.mjs
          node scripts/test-special-boss-geometry.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Review real gameplay and lower hulls in both orientations
        run: node scripts/review-raid-campaign-browser.mjs --captures-only
        env:
          RAID_REVIEW_KEEL_CHECK: '1'
          RAID_REVIEW_OUTPUT: presentation-review/boss-keels-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-boss-lower-hulls-review
          path: presentation-review/boss-keels-v1/
